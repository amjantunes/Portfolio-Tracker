name: Update Exchange Rates

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows me to run it mannualy 

jobs:
  update-exchange-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v3

      - name: Python Setup
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies 
        run: pip install -r requirements.txt

      - name: Updating Script Execution 
        env:
          DATABASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.DATABASE_URL_PRD || secrets.DATABASE_URL_DEV }}
        run: python update_rates.py